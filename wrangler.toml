name = "newleashrescue"
compatibility_date = "2025-07-15"
pages_build_output_dir = "dist"

# NOTE: `vars` and `d1_databases` are "non-inheritable" keys in Cloudflare Pages.
# Because we override `vars` per-environment below, Cloudflare requires EVERY
# non-inheritable key (including `d1_databases`) to be redefined inside each
# [env.*] block — top-level definitions are NOT inherited by named environments.
# Omitting the D1 binding from an env block means that deployment has no DB at
# runtime, so @nuxt/content's server-side queries throw (404 on direct page loads).

# Top-level config — used by local dev (`wrangler pages dev`).
[vars]
# GOOGLE TAG
GA_ID = "G-Z2SQX5PD13"
NUXT_PUBLIC_APPLICATION_DOWNLOADS_ENABLED = "false"

[[d1_databases]]
binding = "newleashrescue_content_db"
database_name = "newleashrescue-content-db"
database_id = "cd667311-b735-4f01-a28c-4cad713a89b5"

# Preview deployments (branch/PR deploys, e.g. *.pages.dev).
[env.preview.vars]
NUXT_PUBLIC_SITE_URL = "https://feature-cloudflare-migration.newleashrescue.pages.dev"
GA_ID = ""  # or a separate preview GA property

[[env.preview.d1_databases]]
binding = "newleashrescue_content_db"
database_name = "newleashrescue-content-db"
database_id = "cd667311-b735-4f01-a28c-4cad713a89b5"

# Production deployment.
[env.production.vars]
NUXT_PUBLIC_SITE_URL = "https://newleashrescue.org"
NUXT_PUBLIC_APPLICATION_DOWNLOADS_ENABLED = "false"
GA_ID = "G-Z2SQX5PD13"

[[env.production.d1_databases]]
binding = "newleashrescue_content_db"
database_name = "newleashrescue-content-db"
database_id = "cd667311-b735-4f01-a28c-4cad713a89b5"
