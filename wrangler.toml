name = "newleashrescue"
compatibility_date = "2025-07-15"
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]

# Static site (`nuxt build` with prerender). Pages Functions run only for form API routes
# (see `shared/static-hosting.ts` / nuxt `nitro.cloudflare.pages.routes`).

# Top-level config — used by local dev (`wrangler pages dev`).
[vars]
# GOOGLE TAG
GA_ID = "G-Z2SQX5PD13"
NUXT_PUBLIC_APPLICATION_DOWNLOADS_ENABLED = "false"
RESEND_TEMPLATE_ID = "f363034a-a7b9-4c17-b14f-b29b13429fbe"
CONTACT_NAME = "New Leash Rescue"

# Preview deployments (branch/PR deploys, e.g. *.pages.dev).
[env.preview.vars]
NUXT_PUBLIC_SITE_URL = "https://feature-cloudflare-migration.newleashrescue.pages.dev"
GA_ID = ""  # or a separate preview GA property
RESEND_TEMPLATE_ID = "f363034a-a7b9-4c17-b14f-b29b13429fbe"
CONTACT_NAME = "New Leash Rescue"

# Production deployment.
[env.production.vars]
NUXT_PUBLIC_SITE_URL = "https://newleashrescue.org"
NUXT_PUBLIC_APPLICATION_DOWNLOADS_ENABLED = "false"
GA_ID = "G-Z2SQX5PD13"
RESEND_TEMPLATE_ID = "f363034a-a7b9-4c17-b14f-b29b13429fbe"
CONTACT_NAME = "New Leash Rescue"
